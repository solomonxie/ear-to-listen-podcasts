name: BringYourOwnPodcasts
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  GRDB:
    url: https://github.com/groue/GRDB.swift
    from: 6.29.3
  AWSSDKSwift:
    url: https://github.com/awslabs/aws-sdk-swift
    from: 1.2.0
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    from: 8.0.0

targets:
  BringYourOwnPodcasts:
    type: application
    platform: iOS
    sources:
      - path: Sources
        excludes:
          - "**/README.md"
      - path: Resources
    dependencies:
      - package: GRDB
        product: GRDB
      - package: AWSSDKSwift
        product: AWSS3
      - package: AWSSDKSwift
        product: AWSSDKIdentity
      - package: GoogleSignIn
        product: GoogleSignIn
    info:
      path: Sources/App/Info.plist
      properties:
        CFBundleDisplayName: Bring Your Own Podcasts
        UIUserInterfaceStyle: Dark
        UILaunchScreen: {}
        UIBackgroundModes:
          - audio
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.byopo
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

  BringYourOwnPodcastsTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: BringYourOwnPodcasts
    settings:
      base:
        SWIFT_VERSION: "6.0"

schemes:
  BringYourOwnPodcasts:
    build:
      targets:
        BringYourOwnPodcasts: all
        BringYourOwnPodcastsTests: [test]
    test:
      targets:
        - BringYourOwnPodcastsTests
