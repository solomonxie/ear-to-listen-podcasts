name: EarToListen
options:
  bundleIdPrefix: com.solomonxie
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  GRDB:
    url: https://github.com/groue/GRDB.swift
    from: 6.29.3
  AWSSDKSwift:
    url: https://github.com/awslabs/aws-sdk-swift
    from: 1.2.0
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    from: 8.0.0

targets:
  EarToListen:
    type: application
    platform: iOS
    sources:
      - path: Sources
        excludes:
          - "**/README.md"
      - path: Resources
    dependencies:
      - package: GRDB
        product: GRDB
      - package: AWSSDKSwift
        product: AWSS3
      - package: AWSSDKSwift
        product: AWSSDKIdentity
      - package: GoogleSignIn
        product: GoogleSignIn
    info:
      path: Sources/App/Info.plist
      properties:
        # Home-screen name. CFBundleName too, or iOS falls back to PRODUCT_NAME
        # ("EarToListen") wherever the display name isn't consulted.
        CFBundleDisplayName: Ear to Listen
        CFBundleName: Ear to Listen
        UIUserInterfaceStyle: Dark
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIBackgroundModes:
          - audio
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        # Makes the app's iCloud folder show up in Files under its own name, so a backup
        # kept there can actually be got at. A container that syncs but stays hidden is
        # worse than a local file.
        NSUbiquitousContainers:
          iCloud.com.solomonxie.eartolisten:
            NSUbiquitousContainerIsDocumentScopePublic: true
            NSUbiquitousContainerName: Ear to Listen
            NSUbiquitousContainerSupportedFolderLevels: Any
        NSSpeechRecognitionUsageDescription: >-
          Transcribes episodes on this device so you can read and correct them.
          Audio stays on your phone.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.solomonxie.eartolisten
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        # iCloud backup needs the container entitlement, which needs a paid team — see
        # the README. Simulator builds still build without one; the iCloud row in
        # Settings reports itself unavailable rather than pretending.
        CODE_SIGN_ENTITLEMENTS: Sources/App/EarToListen.entitlements
        CODE_SIGN_STYLE: Automatic
        # The team that owns the bundle id and the iCloud container. Written here rather
        # than read from the environment: a regenerate without the variable set produced a
        # project that builds for the simulator and fails to sign for a device, which is a
        # confusing way to find out. Fork this repo and it's the one line to change.
        DEVELOPMENT_TEAM: REPLACE_WITH_YOUR_TEAM_ID

  EarToListenTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: EarToListen
    settings:
      base:
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: YES

schemes:
  EarToListen:
    build:
      targets:
        EarToListen: all
        EarToListenTests: [test]
    test:
      targets:
        - EarToListenTests
