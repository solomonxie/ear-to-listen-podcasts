name: EarToListen
options:
  bundleIdPrefix: com.solomonxie
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  GRDB:
    url: https://github.com/groue/GRDB.swift
    from: 6.29.3

targets:
  EarToListen:
    type: application
    platform: iOS
    sources:
      - path: Sources
        excludes:
          - "**/README.md"
      - path: Resources
      - path: Extensions/Share/ShareInbox.swift
      # The sample library behind Settings > Demo mode. Ships in every build.
      - path: DemoData
        excludes:
          - "README.md"
          - "make-audio.py"
    dependencies:
      - package: GRDB
        product: GRDB
      - target: EarToListenShare
    info:
      path: Sources/App/Info.plist
      properties:
        # Written as build settings, not as literals. XcodeGen otherwise bakes
        # CFBundleVersion 1 into the generated plist, and the timestamp
        # `scripts/release-ios.sh` passes as CURRENT_PROJECT_VERSION goes nowhere — every
        # upload then arrives as build 1 and App Store Connect rejects all but the first.
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        # Home-screen name. CFBundleName too, or iOS falls back to PRODUCT_NAME
        # ("EarToListen") wherever the display name isn't consulted.
        CFBundleDisplayName: Ear to Listen
        CFBundleName: Ear to Listen
        UIUserInterfaceStyle: Dark
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIBackgroundModes:
          - audio
        # CarPlay is the only scene declared here: the phone's window stays with SwiftUI's
        # WindowGroup. The car only shows the app once the build carries the CarPlay
        # entitlement — see `make ios CARPLAY=1`.
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
          UISceneConfigurations:
            CPTemplateApplicationSceneSessionRoleApplication:
              - UISceneConfigurationName: CarPlay
                UISceneDelegateClassName: $(PRODUCT_MODULE_NAME).CarPlaySceneDelegate
        # Every screen is a portrait column and the store listing is portrait-only.
        # Delete these two lines to let the phone rotate.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # HTTPS, Keychain and HMAC-SHA256 request signing only — all Apple-exempt. Saying
        # so here answers export compliance at upload instead of per-build in TestFlight.
        ITSAppUsesNonExemptEncryption: false
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        # Makes the app's iCloud folder show up in Files under its own name, so a backup
        # kept there can actually be got at. A container that syncs but stays hidden is
        # worse than a local file.
        NSUbiquitousContainers:
          iCloud.com.solomonxie.eartolisten:
            NSUbiquitousContainerIsDocumentScopePublic: true
            NSUbiquitousContainerName: Ear to Listen
            NSUbiquitousContainerSupportedFolderLevels: Any
        # Storefront a Debug build acts as, from `make ios STORE=…`. Release ignores it.
        EarStorefront: $(EAR_STOREFRONT)
        NSSpeechRecognitionUsageDescription: >-
          Transcribes episodes on this device so you can read and correct them.
          Audio stays on your phone.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.solomonxie.eartolisten
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        EAR_STOREFRONT: ""
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        # iCloud backup needs the container entitlement, which needs a paid team — see
        # the README. Simulator builds still build without one; the iCloud row in
        # Settings reports itself unavailable rather than pretending.
        # Through a setting of its own so `make ios CARPLAY=1` can swap it: a
        # CODE_SIGN_ENTITLEMENTS given on the command line would land on the share
        # extension too.
        APP_ENTITLEMENTS: Sources/App/EarToListen.entitlements
        CODE_SIGN_ENTITLEMENTS: $(APP_ENTITLEMENTS)
        CODE_SIGN_STYLE: Automatic
        # The team that owns the bundle id and the iCloud container. Written here rather
        # than read from the environment: a regenerate without the variable set produced a
        # project that builds for the simulator and fails to sign for a device, which is a
        # confusing way to find out. Fork this repo and it's the one line to change.
        DEVELOPMENT_TEAM: REPLACE_WITH_YOUR_TEAM_ID
    postBuildScripts:
      # .env.demo into non-Release builds only — see DemoData/README.md.
      - name: Demo credentials
        script: sh "$SRCROOT/scripts/demo-secrets.sh"
        basedOnDependencyAnalysis: false

  # "Ear to Listen" in other apps' share sheets — YouTube links in, via `ShareInbox`.
  EarToListenShare:
    type: app-extension
    platform: iOS
    sources:
      - path: Extensions/Share
        excludes:
          - "*.entitlements"
    info:
      path: Extensions/Share/Info.plist
      properties:
        CFBundleDisplayName: Ear to Listen
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsText: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.solomonxie.eartolisten.share
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_ENTITLEMENTS: Extensions/Share/Share.entitlements
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: REPLACE_WITH_YOUR_TEAM_ID

  EarToListenTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: EarToListen
    settings:
      base:
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: YES

schemes:
  EarToListen:
    build:
      targets:
        EarToListen: all
        EarToListenTests: [test]
    test:
      targets:
        - EarToListenTests
